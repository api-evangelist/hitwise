name: Hitwise
description: Hitwise was an online competitive-intelligence and audience-measurement company that
  tracked website traffic, clickstream behavior, and search-term data to help marketers benchmark share
  of visits, referral sources, and competitor performance across industry verticals. Originally an
  Australian firm, it was later owned by Experian and then Connexity. The Hitwise brand has since been
  retired -- as of this enrichment pass the hitwise.com domain no longer serves a live product (it
  returns a lapsed-host "Site is not available" page with a mismatched TLS certificate) and exposes no
  public developer portal, documentation, or API. This profile was surfaced as a portfolio-company lead
  of insight-partners; enrichment found no active API surface to catalog.
